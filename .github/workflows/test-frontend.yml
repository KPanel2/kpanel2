name: Test Frontend

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        id: test
        run: |
          set -o pipefail
          npm test -- --no-watch --browsers=ChromeHeadless --code-coverage 2>&1 | tee ../test-frontend.log

      - name: Check coverage threshold
        if: always() && steps.test.outcome != 'cancelled'
        working-directory: .
        run: node .github/scripts/coverage-warning.mjs test-frontend.log "Frontend"
