name: Test Frontend

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for PR diff coverage
        if: github.event_name == 'pull_request'
        working-directory: .
        run: git fetch origin "${{ github.base_ref }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        id: test
        run: |
          set -o pipefail
          npm test -- --no-watch --browsers=ChromeHeadless --code-coverage 2>&1 | tee ../test-frontend.log

      - name: Report coverage
        if: always() && steps.test.outcome != 'cancelled'
        working-directory: .
        env:
          DIFF_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          args=(
            test-frontend.log
            Frontend
            80
            --json-out coverage-frontend.json
          )
          if [ -n "$DIFF_BASE_REF" ]; then
            args+=(
              --diff-base "$DIFF_BASE_REF"
              --diff-format karma-html
              --diff-coverage-path frontend/coverage/kpanel-frontend
              --diff-source-root frontend/src
            )
          fi
          node .github/scripts/coverage-report.mjs "${args[@]}"

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && steps.test.outcome != 'cancelled'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-pr-coverage-comment.mjs --suite frontend --json coverage-frontend.json
