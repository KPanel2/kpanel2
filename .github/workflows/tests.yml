name: Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}

      - name: Fetch diff base for coverage
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            git fetch origin "${{ github.event.merge_group.base_sha }}"
          else
            git fetch origin "${{ github.base_ref }}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        id: test
        run: |
          set -o pipefail
          npm test -- --no-watch --browsers=ChromeHeadless --code-coverage 2>&1 | tee ../test-frontend.log

      - name: Report coverage
        if: always() && steps.test.outcome != 'cancelled'
        working-directory: .
        env:
          DIFF_BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || (github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '') }}
        run: |
          args=(
            test-frontend.log
            Frontend
            --fail-threshold 80
            --pr-warn-threshold 90
            --json-out coverage-frontend.json
          )
          if [ -n "$DIFF_BASE_REF" ]; then
            args+=(
              --diff-base "$DIFF_BASE_REF"
              --diff-format karma-html
              --diff-coverage-path frontend/coverage/kpanel-frontend
              --diff-source-root frontend/src
            )
          fi
          node .github/scripts/coverage-report.mjs "${args[@]}"

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && steps.test.outcome != 'cancelled'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-pr-coverage-comment.mjs --suite frontend --json coverage-frontend.json

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}

      - name: Fetch diff base for coverage
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            git fetch origin "${{ github.event.merge_group.base_sha }}"
          else
            git fetch origin "${{ github.base_ref }}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests with coverage
        id: test
        run: pytest

      - name: Report coverage
        if: always() && steps.test.outcome != 'cancelled'
        working-directory: .
        env:
          DIFF_BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || (github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '') }}
        run: |
          args=(
            backend/coverage/coverage.json
            Backend
            --fail-threshold 80
            --pr-warn-threshold 90
            --json-out coverage-backend.json
          )
          if [ -n "$DIFF_BASE_REF" ]; then
            args+=(
              --diff-base "$DIFF_BASE_REF"
              --diff-format pytest
              --diff-coverage-path backend/coverage/coverage.json
              --diff-repo-path-prefix backend/
            )
          fi
          node .github/scripts/coverage-report.mjs "${args[@]}"

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && steps.test.outcome != 'cancelled'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-pr-coverage-comment.mjs --suite backend --json coverage-backend.json
