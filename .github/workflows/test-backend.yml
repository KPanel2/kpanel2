name: Test Backend

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests with coverage
        id: test
        run: pytest

      - name: Report coverage
        if: always() && steps.test.outcome != 'cancelled'
        working-directory: .
        run: node .github/scripts/coverage-report.mjs backend/coverage/coverage.json "Backend" 80 --json-out coverage-backend.json

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && steps.test.outcome != 'cancelled'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-pr-coverage-comment.mjs --suite backend --json coverage-backend.json
