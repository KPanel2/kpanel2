services:

  backend:
    image: ghcr.io/kpanel2/kpanel2/backend:latest-stage
    container_name: kpanel-backend
    ports:
      - "8000:8000"
    environment:
      - KPANEL_API_HOST=0.0.0.0
      - KPANEL_API_PORT=8000
      - KPANEL_FRONTEND_BASE_URL=https://kpanel.stage.kumpe.app
      - KPANEL_SESSION_SECRET=${KPANEL_SESSION_SECRET}
      - KPANEL_CORS_ORIGINS=https://kpanel.stage.kumpe.app
      - KPANEL_DB_HOST=172.16.21.10
      - KPANEL_DB_PORT=3306
      - KPANEL_ENFORCE_DEVICE_TOKEN=true
      - KPANEL_DB_USER=${KPANEL_DB_USER}
      - KPANEL_DB_PASSWORD=${KPANEL_DB_PASSWORD}
      - KPANEL_DB_NAME=${KPANEL_DB_NAME}
      - KPANEL_ADMIN_API_KEY=${KPANEL_ADMIN_API_KEY}
      - KPANEL_DEVICE_TOKEN_SECRET=${KPANEL_DEVICE_TOKEN_SECRET}
      - KPANEL_ENFORCE_DEVICE_TOKEN=true
      - KPANEL_REQUIRE_HTTPS=true
      - KPANEL_DEV_AUTH_ENABLED=false
      - KPANEL_CLIENT_MANIFEST_URL=https://raw.githubusercontent.com/KumpeWeb/repo/master/kpanel-client-latest.json
      - KPANEL_LOGTO_ENDPOINT=${KPANEL_LOGTO_ENDPOINT}
      - KPANEL_LOGTO_APP_ID=${KPANEL_LOGTO_APP_ID}
      - KPANEL_API_RESOURCE=${KPANEL_API_RESOURCE}
      - KPANEL_SECONDARY_API_RESOURCE=https://securityflags.kumpeapps.com

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ghcr.io/kpanel2/kpanel2/frontend:latest-stage
    container_name: kpanel-frontend
    ports:
      - "8080:80"
    environment:
      - KPANEL_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
