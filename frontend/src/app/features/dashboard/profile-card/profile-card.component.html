<div class="card profile-card">
  <div class="card-header">
    <h2>Profile</h2>
    <a
      *ngIf="accountCenterAvailable"
      class="btn-ghost"
      [href]="profileManageUrl">
      Edit
    </a>
  </div>

  <div class="profile-row">
    <span class="label">Name</span>
    <span class="value">{{ user.display_name }}</span>
  </div>
  <div class="profile-row">
    <span class="label">Email</span>
    <span class="value">
      {{ user.email }}
      <a *ngIf="accountCenterAvailable" class="inline-link" [href]="emailManageUrl">Update</a>
    </span>
  </div>
  <div class="profile-row">
    <span class="label">Timezone</span>
    <span class="value">{{ user.timezone }}</span>
  </div>
  <div class="profile-row" *ngIf="user.identities?.length">
    <span class="label">Linked providers</span>
    <div class="pills">
      <span
        class="pill"
        [ngClass]="'pill--' + id.provider_name"
        *ngFor="let id of user.identities">
        <span class="pill-icon" [innerHTML]="providerIcon(id.provider_name)"></span>
        <span class="pill-label">{{ providerLabel(id.provider_name) }}</span>
      </span>
    </div>
  </div>

  <p *ngIf="accountCenterAvailable" class="info-msg">
    Profile, timezone, and security settings are managed in
    <a [href]="profileManageUrl">KumpeCloud Account Center</a>.
    <a class="inline-link" [href]="securityManageUrl">Security settings</a>
  </p>
  <p *ngIf="success" class="success-msg">{{ success }}</p>
</div>
