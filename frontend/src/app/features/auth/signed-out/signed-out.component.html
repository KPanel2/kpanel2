<div class="auth-shell">
  <div class="auth-card">
    <div class="hero">
      <img class="logo-img" src="logo.webp" alt="kPanel" />
      <span class="logo-text">kPanel</span>
      <p class="tagline">You're signed out</p>
    </div>
    <p class="info-msg">
      Your kPanel session has ended. Sign in again when you're ready to continue.
    </p>
    <button
      type="button"
      class="provider-button provider-button--kumpecloud"
      (click)="signInAgain()">
      Sign in again
    </button>
  </div>
</div>
